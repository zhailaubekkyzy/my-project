<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FunnelMind AI - Telegram Mini App для маркетологов и онлайн-экспертов</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151f32',
              950: '#070b14'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none antialiased flex flex-col justify-between">

  <!-- Root mount point for the Telegram Mini App -->
  <div id="app-root" class="w-full flex-1 flex flex-col items-center">
    <!-- Content will be rendered by js/app.js -->
    <div class="p-12 text-center text-slate-400">
      <div class="animate-spin w-8 h-8 border-2 border-sky-500 border-t-transparent rounded-full mx-auto mb-3"></div>
      Загрузка FunnelMind AI...
    </div>
  </div>

  <!-- Application Logic -->
  <script src="js/store.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
