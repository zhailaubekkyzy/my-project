<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SmartFlow — Autonomous AI Sales Agent Engine (Telegram Mini App)</title>

  <!-- Google Fonts: Plus Jakarta Sans & Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- App theme, then precompiled Tailwind (npm run build:css).
       Order matters: the Play CDN injected Tailwind after app.css, so utilities win ties. -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-[#060911] text-slate-100 min-h-screen select-none antialiased flex flex-col justify-between font-sans">

  <!-- Root mount point for SmartFlow Telegram Mini App -->
  <div id="app-root" class="w-full flex-1 flex flex-col items-center">
    <!-- Content will be rendered by js/app.js -->
    <div class="p-16 text-center text-slate-400">
      <div class="animate-spin w-9 h-9 border-3 border-[#81D8D0] border-t-transparent rounded-full mx-auto mb-3"></div>
      <div class="text-sm font-semibold text-white">SmartFlow AI Engine</div>
      <div class="text-xs text-[#81D8D0] mt-1 font-handwritten text-base">From idea to selling. Faster.</div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="js/api-client.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
